# Alternativa opcional a `npm run dev`:  docker compose up --build
# Web: http://localhost:5173   API: http://localhost:3000/api/health
# Nota: cada arranque vuelve a cargar los datos de ejemplo (seed idempotente).
services:
  api:
    build: .
    command: sh -c "npm run db:setup && npm run dev -w @festival/api"
    environment:
      DATABASE_URL: file:/data/festival.db
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      JWT_SECRET: cambia-este-secreto-en-docker
    ports:
      - '3000:3000'
    volumes:
      - api-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    command: npm run dev -w @festival/web
    environment:
      VITE_API_PROXY_TARGET: http://api:3000
    ports:
      - '5173:5173'
    depends_on:
      api:
        condition: service_healthy

volumes:
  api-data:
